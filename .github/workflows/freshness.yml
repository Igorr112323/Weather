name: Свежесть zarr

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AgroCast/requirements.txt
      - name: Зависимости
        run: pip install --upgrade pip && pip install -r AgroCast/requirements.txt
      - name: Проверка свежести zarr
        run: cd AgroCast && python -m scripts.zarr_freshness
