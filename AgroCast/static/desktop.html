<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgroCast — локальные прогнозы</title>
<link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css" integrity="sha384-3Zp5dU/2e36sCZIslNy0nR/CpV0m2JOEp63JIiahU1YkB0LiKui1CUM8nml2lmU2" crossorigin="anonymous">
<link rel="stylesheet" href="/assets/desktop.css">
<link rel="icon" type="image/png" href="/assets/agrocast.png">
<script src="/assets/vendor/leaflet/leaflet.js" integrity="sha384-/ebwMPBNh/7cTi+L/d2x6DmcjCLDgJc3BRKB1mGbTgltaFzFP0Mi2YU9I0YGhmjx" crossorigin="anonymous" defer></script>
<script type="module" src="/assets/desktop.js" defer></script>
</head>
<body>
<div id="map" role="application" aria-label="Карта Краснодарского края"></div>
<header class="overlay-title">
<h1>AgroCast</h1>
<p class="tag">Агропрогнозы для Краснодарского края</p>
</header>
<aside class="panel">
<h2>Сезонный прогноз</h2>
<div id="selected-info" class="selected-info">Кликните по карте — будет выбрана ближайшая точка сетки</div>
<div class="controls-row">
<div class="control-group">
<label for="start">Месяц выпуска</label>
<input id="start" type="month">
</div>
<div class="control-group">
<label for="horizon">Интервал</label>
<select id="horizon">
<option value="1">1 месяц</option>
<option value="3" selected>3 месяца</option>
<option value="6">6 месяцев</option>
</select>
</div>
</div>
<button id="run" type="button" class="big">Показать прогноз</button>
<button id="cancel" type="button" class="secondary" hidden>Отменить</button>
<p id="status" role="status" aria-live="polite" class="status">Выберите точку на карте и месяц выпуска.</p>
<div id="result" hidden>
<div id="summary"></div>
</div>
</aside>
</body>
</html>
