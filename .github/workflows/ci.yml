name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgroCast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            AgroCast/requirements.txt
            AgroCast/requirements-test.txt
      - name: Зависимости
        run: pip install --upgrade pip && pip install -r requirements-test.txt
      - name: Тесты
        run: python -m pytest tests/ -q
      - name: Мини-аудит 5 точек
        run: python -m scripts.audit_full mini5 --workers 2

  identity-postgresql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgroCast
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agrocast_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agrocast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            AgroCast/requirements.txt
            AgroCast/requirements-test.txt
      - name: Зависимости
        run: pip install -r requirements-test.txt
      - name: Конфигурация изолированной тестовой БД
        run: |
          umask 077
          mkdir -p data/identity-ci
          printf '%s\n' 'postgresql+psycopg://postgres@127.0.0.1:5432/agrocast_test' > data/identity-ci/database_url
          printf 'AGROCAST_TEST_DATABASE_URL_FILE=%s/data/identity-ci/database_url\n' "$PWD" >> "$GITHUB_ENV"
      - name: Авторизация и владение на PostgreSQL
        run: python -m pytest tests/test_identity_auth.py tests/test_identity_resources.py tests/test_identity_admin.py tests/test_identity_storage.py tests/test_pilot_access.py tests/test_api_contracts.py tests/test_contract_migration.py tests/test_result_cache.py -q

  browser-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    defaults:
      run:
        working-directory: AgroCast
    env:
      AGROCAST_BROWSER_TESTS: "1"
      AGROCAST_BROWSER_ENGINE: ${{ matrix.browser }}
      AGROCAST_BROWSER_ARTIFACTS: data/browser
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            AgroCast/requirements.txt
            AgroCast/requirements-test.txt
            AgroCast/requirements-browser.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AgroCast/package-lock.json
      - name: Python dependencies
        run: pip install -r requirements-browser.txt
      - name: Locked browser assets and DOM checks
        run: npm ci --ignore-scripts && npm run check:vendor && npm run check:dom
      - name: Browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: HTTPS DOM and CSP scenarios
        run: python -m pytest tests/browser -q --junitxml=data/browser/results.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-security-${{ matrix.browser }}
          path: AgroCast/data/browser/
          retention-days: 7
