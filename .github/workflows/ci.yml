name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgroCast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AgroCast/requirements.txt
      - name: Зависимости
        run: pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Тесты
        run: python -m pytest tests/ -q
      - name: Мини-аудит 5 точек
        run: python -m scripts.audit_full mini5 --workers 2
