name: desktop-builds
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
        working-directory: AgroCast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AgroCast/requirements-desktop.txt
      - name: Системные зависимости macOS
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "DYLD_LIBRARY_PATH=$(brew --prefix libomp)/lib" >> "$GITHUB_ENV"
      - name: Зависимости
        run: pip install -r requirements.txt -r requirements-desktop.txt -r requirements-test.txt
      - name: Тесты десктоп-режима
        run: |
          set -o pipefail
          python -m pytest tests/test_desktop.py tests/test_runtime_settings.py tests/test_readiness.py -q -p no:cacheprovider 2>&1 | tee pytest-output.log || { echo "::error::pytest: $(grep -E '^(FAILED|E  |_{6,})' pytest-output.log | tail -c 3500 | tr '\n' '|')"; exit 1; }
      - name: Смоук встроенного сервера без GUI
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee smoke-output.log || { echo "::error::smoke: $(grep -E 'Traceback|Error|error|failed|assert' smoke-output.log | tail -c 3500 | tr '\n' '|')"; exit 1; }
          import json, urllib.request
          from agrocast.desktop.app import prepare_environment, start_server
          prepare_environment("build-smoke")
          server, thread, url = start_server()
          try:
              with urllib.request.urlopen(url + "api/capabilities", timeout=15) as response:
                  payload = json.load(response)
          finally:
              server.should_exit = True
              thread.join(timeout=15)
          assert payload["operations"]["local_mode"] is True
          print("desktop server smoke ok")
          PY
      - name: Сборка приложения
        run: |
          set -o pipefail
          python -m PyInstaller --noconfirm desktop/AgroCast.spec 2>&1 | tee pyinstaller-output.log || { echo "::error::build: $(grep -A 12 -E 'Traceback|ERROR:' pyinstaller-output.log | tail -c 3400 | tr '\n' '|')"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: agrocast-desktop-${{ matrix.os }}
          path: AgroCast/dist/AgroCast
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "agrocast-desktop-*"
          merge-multiple: false
          path: downloads
      - name: Упаковка, контрольные суммы, draft-релиз
        run: |
          set -euo pipefail
          mkdir -p assets
          cd downloads
          for name in agrocast-desktop-*; do
            case "$name" in
              *windows*) out="AgroCast-windows-x64.zip" ;;
              *macos*)   out="AgroCast-macos-arm64.tar.gz" ;;
              *)         out="AgroCast-linux-x64.tar.gz" ;;
            esac
            ( cd "$name" && zip -qr "../../assets/$out" . )
          done
          cd ../assets
          sha256sum AgroCast-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "AgroCast desktop $GITHUB_REF_NAME" \
            --notes "Сборка прогнана на том же коммите: матрица desktop-тестов, смоук сервера без GUI и PyInstaller-артефакты (job build). Архивы не подписаны — сверьте SHA256SUMS перед установкой. Научный допуск и агро-верификация выпускаются по RELEASE_CHECKLIST закрытого пилота; агрорекомендации публикуются только с маркировкой подтверждённости. В состав включен read-only seed-bundle (world/) с производными NOAA и Copernicus-данными; права и атрибуции — docs/production/DATA_LICENSES.md. Откат набора данных: scripts/bundle_publish rollback." \
            AgroCast-* SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
