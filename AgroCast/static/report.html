<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Отчёт AgroCast</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#f2f5ee;color:#22301f;padding:24px}
.wrap{max-width:940px;margin:0 auto}
.head{background:linear-gradient(120deg,#2e5a2a,#4d8337);color:#fff;border-radius:16px;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.head h1{font-size:21px}
.head .sub{font-size:13px;opacity:.92;margin-top:6px}
.stamp{font-size:12.5px;background:rgba(255,255,255,.16);border-radius:10px;padding:8px 14px;text-align:right;line-height:1.6}
.block{background:#fff;border:1px solid #dde7d4;border-radius:14px;padding:18px 22px;margin-top:16px;box-shadow:0 1px 3px rgba(40,70,30,.06)}
.block h2{font-size:16px;color:#3c6a2f;margin-bottom:10px}
.dash{display:flex;gap:14px;flex-wrap:wrap}
.dcard{flex:1;min-width:150px;background:linear-gradient(160deg,#eef5e6,#f8fcf4);border:1px solid #cfe6bb;border-radius:14px;padding:14px;text-align:center}
.dcard b{display:block;font-size:28px;color:#2c4a24;line-height:1.1}
.dcard span{font-size:12px;color:#5a7050}
.dcard i{font-style:normal;font-size:11px;color:#8aa66a;display:block;margin-top:4px}
.lights{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.light{flex:1;min-width:150px;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#fff;text-align:center}
.g-ok{background:#6fae3f}.g-warn{background:#d2803a}.g-bad{background:#c4554d}.g-mid{background:#7a8f6d}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
th{background:#eef5e6;color:#3c5a2c;text-align:left;padding:7px 8px;font-size:11.5px}
td{padding:6px 8px;border-bottom:1px solid #edf2e6}
tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;font-weight:600;color:#2c4a24}
.pill{display:inline-block;border-radius:8px;padding:2px 9px;font-size:11px;color:#fff;background:#8aa668}
.pill.bad{background:#c4554d}.pill.warn{background:#d2803a}.pill.ok{background:#6fae3f}
.tbar{display:flex;height:26px;border-radius:7px;overflow:hidden;font-size:11.5px;color:#fff;font-weight:600;margin-top:4px}
.tbar div{display:flex;align-items:center;justify-content:center;min-width:30px}
.c0{background:#4d7fc4}.c1{background:#8aa668}.c2{background:#d2803a}
.fbar{display:flex;height:26px;border-radius:7px;overflow:hidden;font-size:11.5px;color:#fff;font-weight:600;margin-top:4px}
.legend{display:flex;gap:16px;font-size:11.5px;color:#6a7a62;margin-top:6px}
.legend span::before{content:'◼ ';color:#4d7fc4}
.legend .l1::before{color:#8aa668}.legend .l2::before{color:#d2803a}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dashed #e4ecdc}
.kv b{color:#2c4a24}.kv:last-child{border-bottom:none}
.agro{background:#f4faf0;border:1px solid #cfe6bb;border-left:5px solid #6fae3f}
.agro h3{font-size:14px;color:#3c6a2f;margin:10px 0 6px}
.tag{display:inline-block;font-size:11.5px;color:#fff;border-radius:8px;padding:3px 10px;margin-right:6px;background:#6fae3f}
.tag.warn{background:#d2803a}.tag.bad{background:#c4554d}
.verdict{font-size:13.5px;line-height:1.65;color:#33402e;margin-top:6px}
.verdict b{color:#2c4a24}
.foot{font-size:11.5px;color:#7d8d76;margin-top:14px;line-height:1.6}
.btn{display:inline-block;background:#6fae3f;color:#fff;border:none;border-radius:9px;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:600;margin-top:12px}
.btn.g{background:#8aa668}
.meter{background:#e7efd9;border-radius:6px;height:14px;position:relative;overflow:hidden;min-width:90px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:#8aa668}
.meter i.low{background:#d2803a}.meter i.over{background:#c4554d}
.row2{display:flex;gap:18px;flex-wrap:wrap}.row2>div{flex:1;min-width:240px}
@media print{.btn{display:none}body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:12mm}.block{break-inside:avoid}h2{break-after:avoid}table{font-size:9.5px}.pill,.light{border:1px solid #bbb}.printfoot{display:block;font-size:9px;color:#6a7a62;margin-top:8px}}.printfoot{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="block">Загружаю отчёт…</div></div>
<script>
const q=new URLSearchParams(location.search);
const job=q.get('job');
const MN=['','январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MNS=['','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const SEAS={3:'весна (MAM)',6:'лето (JJA)',9:'осень (SON)',12:'зима (DJF)'};
const WORD=['ниже нормы','норма','выше нормы'];
const pctl=p=>Math.round(p*100)+'%';
function bar(p){const a=[p.below,p.normal,p.above];return '<div class="tbar">'+a.map((v,i)=>'<div class="c'+i+'" style="width:'+Math.max(v*100,7)+'%">'+Math.round(v*100)+'%</div>').join('')+'</div>'}
function factbar(t){return '<div class="fbar"><div class="c'+t+'" style="width:100%">факт: '+WORD[t]+'</div></div>'}
function kv(k,v){return '<div class="kv"><span>'+k+'</span><b>'+v+'</b></div>'}
function conf(c){const m={high:'высокая',medium:'средняя',low:'низкая'};return c?(m[c]||c):'—'}
function chip3(t,v,i){return '<div class="dcard"><b>'+v+'</b><span>'+t+'</span>'+(i?'<i>'+i+'</i>':'')+'</div>'}
function advice(a){
 if(!a)return '';
 let h='<div class="block agro"><h2>Рекомендации фермеру</h2>';
 if(a.drought){const d=a.drought;
  const cls=d.risk_level==='высокий'?'bad':(d.risk_level==='повышенный'||d.risk_level==='умеренный'?'warn':'');
  h+='<span class="tag '+cls+'">риск засухи: '+d.risk_level+'</span>';
  if(d.gtk_class)h+='<span class="tag">ГТК: '+d.gtk_class+'</span>';
  h+='<div class="verdict">Вероятность осадков ниже нормы: <b>'+pctl(d.p_below_norm)+'</b>';
  if(d.deficit_mm!=null)h+=' · ожидаемый дефицит к норме: <b>'+d.deficit_mm+' мм</b>';
  if(d.irrigation_hint_m3_ha!=null)h+='<br>Ориентир полива: <b>≈ '+d.irrigation_hint_m3_ha+' м³/га</b> за сезон (1 мм ≈ 10 м³/га)';
  h+='</div>'}
 (a.sowing||[]).forEach(s=>{h+='<h3>Сев: '+s.crop+'</h3><div class="verdict">'+s.verdict+' (медиана температуры '+s.t2m_p50_c+'°C)</div>'});
 if(a.harvest)h+='<h3>Уборка</h3><div class="verdict">'+a.harvest+'</div>';
 if(a.livestock)h+='<h3>Животноводство</h3><div class="verdict">'+a.livestock+'</div>';
 h+='<div class="foot">'+(a.disclaimer||'')+'</div></div>';
 return h}
function fcBlock(b,name,u){
 let h='<div style="font-size:12.5px;color:#6a7a62;margin:10px 0 6px">Вероятности: ниже нормы / норма / выше нормы</div>'+bar(b.tercile_probs)+
 '<div class="legend"><span>ниже нормы</span><span class="l1">норма</span><span class="l2">выше нормы</span></div>';
 const q=u==='°C'?b.quantiles_c:b.quantiles_mm,n=u==='°C'?b.normal_c:b.normal_mm;
 h+=kv('Медиана (P50)',(u==='°C'?q.p50.toFixed(1):Math.round(q.p50))+' '+u)+
    kv('Диапазон P10–P90',(u==='°C'?q.p10.toFixed(1):Math.round(q.p10))+' … '+(u==='°C'?q.p90.toFixed(1):Math.round(q.p90))+' '+u)+
    kv('Норма 1991–2020',(u==='°C'?n.toFixed(1):Math.round(n))+' '+u)+
    kv('Уверенность прогноза',conf(b.confidence));
 if(b.confidence&&b.confidence.no_skill)h+='<div style="margin:6px 0;padding:6px 9px;background:#f6efe3;border-left:3px solid #c9a227;font-size:12px">⚠ Навык по этой переменной не подтверждён (RPSS ≤ 0 за 20 лет): значения уровня климатологии. Для решений использовать с осторожностью.</div>';
 if(b.analog_years&&b.analog_years.length)h+=kv('Года-аналоги',b.analog_years.slice(0,4).map(a=>a.year).join(', '));
 return h}
function decLabel(l){const p=l.split('-');return MNS[+p[1]]+' · декада '+p[2]}
function range3(o,suf){return '<span class="num">'+o.p50+'</span> <span style="color:#8a9a82;font-size:11px">('+o.p10+'…'+o.p90+suf+')</span>'}
fetch('/api/job/'+job).then(r=>r.json()).then(st=>{
 if(st.status!=='done'){
  document.getElementById('app').innerHTML='<div class="block">'+(st.error||'Расчёт ещё идёт — обновите страницу через минуту')+'<br><a href="/" style="color:#3c6a2f">← к карте</a></div>';return}
 const f=st.report;
 let h='';
 if(f.kind==='hindcast'){
  const it=f.items||[];
  h='<div class="head"><div><h1>Проверка на истории · '+f.start+'</h1><div class="sub">'+f.lat.toFixed(3)+'°N · '+f.lon.toFixed(3)+'°E · '+(f.mode==='seasonal'?'сезонный режим':'месячный режим')+' · модели знали только годы до этой даты</div></div><div class="stamp">ходьба в прошлое<br>walk-forward, без подглядывания</div></div>';
  const s=f.summary||{};
  h+='<div class="block"><h2>Итог проверки</h2><div class="dash">'+
  chip3('температура: попаданий',s.t2m?s.t2m.hits+'/'+s.t2m.total:'—')+
  chip3('осадки: попаданий',s.tp?s.tp.hits+'/'+s.tp.total:'—')+
  chip3('случайный уголок','33%')+'</div>'+
  '<div class="foot">«Попадание» = самый вероятный терциль прогноза совпал с фактом. Промахи — нормальная часть вероятностного прогноза: смотрите вероятности, а не только доминанту.</div></div>';
  it.forEach(b=>{
   const ttl=f.mode==='seasonal'?((SEAS[b.target_month]||MN[b.target_month])+' '+(b.year||'')):(MN[b.target_month]+' '+(b.year||''));
   h+='<div class="block"><h2>'+(f.mode==='seasonal'?'Сезон: ':'Месяц: ')+ttl+'</h2><div class="row2"><div>'+hindVar(b.t2m,'Температура')+'</div><div>'+hindVar(b.tp,'Осадки')+'</div></div></div>';
  });
  h+='<div class="foot">Модели обучены только на данных до даты расчёта. Блендинг весов и нейроядро тоже не видели проверяемый период.</div>';
 }else{
  const items=f.seasons||f.months||[];
  const agro=f.agro||{};
  const si=agro.season_indices||{};
  const ins=agro.insight||{};
  const s0=items[0]||{};
  h='<div class="head"><div><h1>Агрологический отчёт AgroCast</h1><div class="sub">'+f.lat.toFixed(3)+'°N · '+f.lon.toFixed(3)+'°E · '+(f.mode==='seasonal'?'сезонный режим':'месячный режим')+' · '+(items.length)+' '+(f.mode==='seasonal'?'сезон(а)':'месяц(ев)')+'</div></div><div class="stamp">выпуск: '+f.start+'<br>данные по: '+f.issue_data_through+'</div></div>';
  const tq=(s0.t2m||{}).quantiles_c,tn=(s0.t2m||{}).normal_c;
  const pq=(s0.tp||{}).quantiles_mm,pn=(s0.tp||{}).normal_mm;
  const wtr=ins.water||{};
  const tAnom=tq&&tn!=null?(tq.p50-tn).toFixed(1):null;
  const tAnomTxt=tAnom==null?'—':((tAnom>0?'+':'')+tAnom+'°C');
  const pPct=pq&&pn?Math.round(pq.p50/pn*100):null;
  const irr=(wtr.irrigation_m3_ha||{}).p50;
  const irrTxt=irr==null?'—':(irr>0?irr+' м³/га':'0 · покрывается запасом почвы');
  h+='<div class="block"><h2>Главное за первый период</h2><div class="dash">'+
  (tAnom!=null?chip3('температура к норме',tAnomTxt,'медиана P50'):'')+
  (pPct!=null?chip3('осадки от нормы',pPct+'%','медиана P50'+((s0.tp&&s0.tp.confidence&&s0.tp.confidence.no_skill)?' · уровень климатологии':'')):'')+
  chip3('оросительная норма',irrTxt,'медиана; сухой сценарий '+(wtr.irrigation_m3_ha||{}).p10+' м³/га'+((s0.tp&&s0.tp.confidence&&s0.tp.confidence.no_skill)?' · осадки: климатология, навык не подтверждён':''))+
  '</div>';
  const lights=[];
  const adv=(s0.advice||{});
  const dr=(adv.drought||{});
  if(dr.risk_level){const c=dr.risk_level==='низкий'?'g-ok':(dr.risk_level==='умеренный'||dr.risk_level==='повышенный'?'g-warn':'g-bad');
   lights.push('<div class="light '+c+'">Засуха: '+dr.risk_level+(dr.p_below_norm!=null?' · сухо с вер. '+Math.round(dr.p_below_norm*100)+'%':'')+'</div>')}
  (adv.sowing||[]).slice(0,1).forEach(s=>{lights.push('<div class="light g-mid">Сев: '+s.crop+' — '+s.verdict.split(':')[0]+'</div>')});
  (ins.risks||[]).slice(0,1).forEach(r=>{lights.push('<div class="light '+(r.prob>0.5?'g-warn':'g-mid')+'">'+r.label.split('(')[0]+': '+Math.round(r.prob*100)+'%</div>')});
  if(lights.length)h+='<div class="lights">'+lights.join('')+'</div>';
  h+='</div>';
  const wtd=agro.what_to_do||[];
  if(wtd.length){
   h+='<div class="block agro"><h2>Главное — что делать</h2>';
   wtd.forEach(c=>{
    const cls=c.level==='high'?'bad':(c.level==='mid'?'warn':'');
    const lab=c.level==='high'?'важно':(c.level==='mid'?'держать в голове':'фон');
    h+='<div style="margin-top:8px"><span class="tag '+cls+'">'+lab+'</span> <b>'+c.action+'</b><div class="verdict">'+(c.reason||'')+(c.note?' · <i>'+c.note+'</i>':'')+'</div></div>';
   });
   h+='<div class="foot">Топ-3 по вероятности события и порогу окупаемости: действие окупается, если вероятность выше доли затрат в возможных потерях.</div></div>';
  }
  const pp=agro.passport;
  if(pp){
   h+='<div class="block"><h2>Паспорт доверия (сеть станций, этот сезон)</h2>'+
   '<div class="dash">'+chip3('RPSS против нормы','+'+pp.rpss,'навык за '+pp.n_years+' прогнозо-лет')+
   chip3('точность доминанты',Math.round(pp.hit_all*100)+'%',(pp.hit_conf!=null?'на уверенных '+Math.round(pp.hit_conf*100)+'%':''))+
   chip3('охват уверенных',Math.round((pp.coverage_conf||0)*100)+'%','доля прогнозов с заявленной позицией')+'</div>'+
   '<div class="foot">RPSS>0 — лучше климатологической нормы; наугад −0.5…0. Навык оценён по всем станциям сети за 17 лет walk-forward без подглядывания и относится к этому сезону; для конкретной точки это фоновая, а не точечная оценка. Полную проверку любого прошедшего года можно запустить на карте: выберите прошлый месяц — система сойдёт в прошлое без подглядывания.</div></div>';
  }
  const tl=agro.trust_ledger;
  if(tl&&tl.overall){
   h+='<div class="block"><h2>Реестр доверия: публичный счёт навыка</h2><div class="dash">'+
   chip3('навык всего, RPSS',(tl.overall.rpss>0?'+':'')+tl.overall.rpss, tl.overall.n+' посчитанных прогнозов')+
   (tl.t2m?chip3('температура, RPSS',(tl.t2m.rpss>0?'+':'')+tl.t2m.rpss, 'попадание '+Math.round(tl.t2m.hit*100)+'%'):'')+
   (tl.tp?chip3('осадки, RPSS',(tl.tp.rpss>0?'+':'')+tl.tp.rpss, 'попадание '+Math.round(tl.tp.hit*100)+'%'):'')+
   (tl.p80_coverage!=null?chip3('коридор P10–P90',Math.round(tl.p80_coverage*100)+'%','факт внутри коридора; цель ≈80%'):'')+
   '</div>';
   if(tl.by_season){
    h+='<table><tr><th>Сезон</th><th>RPSS</th><th>Попадание</th><th>Попадание (уверенные)</th><th>ECE</th><th>n</th></tr>';
    ['DJF','MAM','JJA','SON'].forEach(se=>{const b=tl.by_season[se]; if(!b)return;
     h+='<tr><td>'+({DJF:'зима',MAM:'весна',JJA:'лето',SON:'осень'})[se]+'</td><td class="num">'+(b.rpss>0?'+':'')+b.rpss+'</td><td class="num">'+Math.round(b.hit*100)+'%</td><td class="num">'+(b.hit_conf!=null?Math.round(b.hit_conf*100)+'%':'—')+'</td><td class="num">'+(b.ece!=null?b.ece:'—')+'</td><td class="num">'+b.n+'</td></tr>';
    });
    h+='</table>';
   }
   if(tl.by_lead){
    h+='<table style="margin-top:10px"><tr><th>Горизонт</th><th>RPSS</th><th>Попадание</th><th>ECE</th><th>n</th></tr>';
    ['1','2-3','4-6'].forEach(lk=>{const b=tl.by_lead[lk]; if(!b)return;
     h+='<tr><td>'+lk+' мес</td><td class="num">'+(b.rpss>0?'+':'')+b.rpss+'</td><td class="num">'+Math.round(b.hit*100)+'%</td><td class="num">'+(b.ece!=null?b.ece:'—')+'</td><td class="num">'+b.n+'</td></tr>';
    });
    h+='</table>';
   }
   if(tl.live&&tl.live.length){
    h+='<h3>Живые выпуски (с хэшем входов — подлинностно проверяемы)</h3><table><tr><th>Выпуск</th><th>Переменная</th><th>Цель</th><th>Вероятности ниже/норма/выше</th><th>Хэш</th></tr>';
    tl.live.forEach(r=>{h+='<tr><td>'+r.issue+'</td><td>'+(r.variable==='t2m'?'температура':'осадки')+'</td><td>'+r.target+'</td><td class="num">'+r.p0.toFixed(2)+' / '+r.p1.toFixed(2)+' / '+r.p2.toFixed(2)+'</td><td style="font-family:Consolas,monospace;font-size:11px">'+(r.hash||'')+'</td></tr>'});
    h+='</table>';
   }
   h+='<div class="foot">Каждый прогноз фиксируется в реестре с SHA-256-хэшем входов — «навык за годы» пересчитывается из этих записей, подделка видна. RPSS>0 — лучше климатологической нормы. ECE — среднее |заявленная вероятность − наблюдаемая частота| по калибровочным корзинам (меньше — вероятности честнее). Коридор P10–P90 — конформная калибровка: конечновыборочная гарантия, что факт внутри коридора ≈80% случаев (проверено в проверке прошлого 2004–24: 79–80%).</div></div>';
  }
  if(ins.decades&&ins.decades.length){
   h+='<div class="block"><h2>По декадам (коридоры P10–P90 по ансамблю '+agro.n_ensemble+' реализаций)</h2><table><tr><th>Декада</th><th>T к норме, °C</th><th>Осадки, мм</th><th>ET₀, мм</th><th>Полив нетто, м³/га</th><th>Мин. tmin, °C</th><th>Полевые работы</th></tr>';
   ins.decades.forEach(d=>{
    const ok=d.field_ok>=0.7?'ok':(d.field_ok>=0.4?'warn':'bad');
    const irr=d.irr_m3_ha||{};
    h+='<tr><td>'+decLabel(d.label)+'</td><td>'+range3(d.t_anom,'')+'</td><td>'+range3(d.precip_mm,'')+'</td><td class="num">'+d.et0_mm+'</td><td class="num">'+Math.round(irr.p50||0)+' · '+Math.round(irr.p10||0)+'<div style="font-size:10px;color:#8a9a82">медиана · сухой</div></td><td class="num">'+d.tmin_min_p10+'</td><td><span class="pill '+ok+'">'+Math.round(d.field_ok*100)+'% пригодно</span></td></tr>';
   });
   h+='</table><div class="foot">«Пригодно» — доля ансамбля, где в декаде не более 1 дня с дождём >10 мм (проезд техники). ET₀ — испаряемость по Харгревзу.</div></div>';
  }
  if(wtr.et0_mm){
   h+='<div class="block"><h2>Водный баланс и полив</h2>'+
   kv('Запас доступной влаги в почве (0–200 см)',(wtr.reserve_mm!=null?wtr.reserve_mm+' мм':'—')+(wtr.swvl!=null?' (влажность '+Math.round(wtr.swvl*100)+'% об.)':''))+
   kv('Испаряемость ET₀ за период',wtr.et0_mm.p50+' мм (коридор '+wtr.et0_mm.p10+'–'+wtr.et0_mm.p90+')')+
   kv('Потребность культуры ETc (k_c='+wtr.kc+')',wtr.etc_mm+' мм')+
   kv('Осадки за период (медиана)',wtr.precip_mm.p50+' мм (коридор '+wtr.precip_mm.p10+'–'+wtr.precip_mm.p90+')')+
   kv('Дефицит влаги',wtr.deficit_mm+' мм')+
   kv('Оросительная норма (медиана)',((wtr.irrigation_m3_ha||{}).p50||0)+' м³/га')+
   kv('Оросительная норма (сухой сценарий P10)',((wtr.irrigation_m3_ha||{}).p10||0)+' м³/га')+
   '<div class="foot">Норма = ETc − осадки − доступный запас (40% от запаса разрешено расходовать). 1 мм = 10 м³/га. Медиана 0 означает: дефицит покрывается почвенным запасом; планируйте полив по сухому сценарию.</div></div>';
  }
  const sat=ins.sat||{};
  if(sat.b10){
   h+='<div class="block"><h2>Сумма активных температур (САТ) за период</h2><div class="dash">'+
   chip3('САТ > 5°C',sat.b5.p50+'°C·сут','коридор '+sat.b5.p10+'–'+sat.b5.p90)+
   chip3('САТ > 10°C',sat.b10.p50+'°C·сут','коридор '+sat.b10.p10+'–'+sat.b10.p90)+'</div>';
   if(sat.crops&&sat.crops.length){
    h+='<table style="margin-top:10px"><tr><th>Культура</th><th>Порог</th><th>Потребность</th><th>Обеспеченность</th><th>Вердикт</th></tr>';
    sat.crops.forEach(c=>{
     const cls=c.verdict.startsWith('дефицит')?'low':(c.verdict.startsWith('избыток')?'over':'');
     const w=Math.min(120,Math.max(3,c.coverage*1.2));
     h+='<tr><td>'+c.name+'<div style="font-size:10.5px;color:#8a9a82">'+c.note+'</div></td><td>&gt;'+c.base+'°C</td><td class="num">'+c.need+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="meter"><i class="'+cls+'" style="width:'+w+'%"></i></div><span class="num">'+c.coverage+'%</span></div></td><td style="font-size:11.5px">'+c.verdict+'</td></tr>';
    });
    h+='</table>';
   }
   h+='<div class="foot">САТ — накопление температуры выше биологического порога за период прогноза. Полную потребность культура набирает за весь цикл — при частичном покрытии периода показан рост за период.</div></div>';
  }
  const ph=agro.phenology||{};
  if(ph.crops&&ph.crops.length){
   h+='<div class="block"><h2>Фено-календарь: фазы культур в этом периоде</h2>';
   ph.crops.forEach(c=>{
    const cls=c.verdict==='благоприятно'?'ok':(c.verdict==='умеренный риск'?'warn':(c.verdict==='неблагоприятно'?'bad':''));
    h+='<h3>'+c.name+' <span class="pill '+cls+'">'+c.verdict+(c.p_stress!=null?' · риск фаз '+Math.round(c.p_stress*100)+'%':'')+'</span></h3>';
    h+='<table><tr><th>Фаза</th><th>Окно</th><th>Событие</th><th>Вероятность</th><th>Чем грозит</th><th>Что делать</th></tr>';
    c.stages.forEach(s=>{
     const pcls=s.prob>=0.5?'bad':(s.prob>=0.25?'warn':'ok');
     h+='<tr><td><b>'+s.name+'</b>'+(s.soil_t!=null?'<div style="font-size:10.5px;color:#8a9a82">почва '+s.soil_t+'°C · нужно ≥'+s.need_t+'°C</div>':'')+'</td><td style="font-size:11.5px">'+s.window+'</td><td style="font-size:11.5px">'+s.crit+'</td><td><span class="pill '+pcls+'">'+Math.round(s.prob*100)+'%</span></td><td style="font-size:11.5px">'+s.impact+'</td><td style="font-size:11.5px">'+s.action+'</td></tr>';
    });
    h+='</table>';
   });
   h+='<div class="foot">Вероятности — доля ансамбля погодных реализаций, в которой событие фазы наступает. «Окно сева» — наоборот, доля пригодных реализаций (сухо и почва прогрета).</div></div>';
  }
  const drv=agro.drivers||{};
  if((drv.t2m&&drv.t2m.length)||(drv.tp&&drv.tp.length)){
   h+='<div class="block"><h2>Почему такой прогноз (драйверы)</h2><table><tr><th>Драйвер</th><th>Связь с сезоном (r)</th><th>Сейчас</th><th>Куда тянет</th></tr>';
   (drv.t2m||[]).forEach(d=>{h+='<tr><td>'+d.name+' <span style="color:#8a9a82;font-size:11px">→ температура</span></td><td class="num">'+(d.r>0?'+':'')+d.r+'</td><td class="num">'+(d.now>0?'+':'')+d.now+'σ</td><td><b style="color:'+(d.push==='к теплу'?'#c4672a':'#4d7fc4')+'">'+d.push+'</b></td></tr>'});
   (drv.tp||[]).forEach(d=>{h+='<tr><td>'+d.name+' <span style="color:#8a9a82;font-size:11px">→ осадки</span></td><td class="num">'+(d.r>0?'+':'')+d.r+'</td><td class="num">'+(d.now>0?'+':'')+d.now+'σ</td><td><b style="color:'+(d.push==='к влаге'?'#4d7fc4':'#c4672a')+'">'+d.push+'</b></td></tr>'});
   h+='</table><div class="foot">Связь — корреляция на истории (только прошлые годы). «Сейчас» — состояние предиктора в сигмах относительно собственной изменчивости.</div></div>';
  }
  const dec=agro.decisions||[];
  if(dec.length){
   h+='<div class="block"><h2>Стоит ли действовать (правило окупаемости)</h2><table><tr><th>Решение</th><th>Вероятность события</th><th>Порог</th><th>Вердикт</th></tr>';
   dec.forEach(d=>{
    const cls=d.verdict==='действовать'?'ok':(d.verdict==='не окупается'?'':'warn');
    h+='<tr><td><b>'+d.label+'</b><div style="font-size:10.5px;color:#8a9a82">'+d.note+'</div></td><td class="num">'+Math.round(d.prob*100)+'%</td><td class="num">'+Math.round(d.ratio*100)+'%</td><td><span class="pill '+cls+'">'+d.verdict+'</span></td></tr>';
   });
   h+='</table><div class="foot">Правило cost/loss: действие окупается, если вероятность события выше доли затрат в возможных потерях. Пороги — типовые, уточняйте под свои затраты.</div></div>';
  }
  const ec=agro.econ;
  if(ec&&ec.crops&&ec.crops.length){
   h+='<div class="block"><h2>Что на кону в деньгах (₽/га)</h2><table><tr><th>Культура</th><th>Цена, ₽/т</th><th>Риск засухи</th><th>Убыток без полива</th><th>Полив стоит</th><th>Риск жары</th><th>Убыток без защиты</th><th>Антистресс стоит</th></tr>';
   ec.crops.forEach(c=>{
    const pi=c.irrigation==='окупается'?'ok':(c.irrigation==='на грани'?'warn':'');
    const pa=c.antistress==='окупается'?'ok':(c.antistress==='на грани'?'warn':'');
    h+='<tr><td><b>'+c.name+'</b>'+(c.variety?'<div style="font-size:10.5px;color:#8a9a82">сорт: '+c.variety+'</div>':'')+'<div style="font-size:10.5px;color:#8a9a82">урожайность '+String(c.yield_t_ha).replace('.',',')+' т/га</div></td><td class="num">'+c.price_rub_t.toLocaleString('ru-RU')+' ₽<div style="font-size:10.5px;color:#8a9a82">'+(c.price_as_of||'')+(c.price_usd_per_t!=null?' · '+String(c.price_usd_per_t).replace('.',',')+' $/т':'')+(c.price_stale?' · <span style="color:#c4554d">цена устарела</span>':'')+'</div></td><td class="num">'+Math.round(c.drought_p*100)+'%</td><td class="num">'+c.loss_drought_rub.toLocaleString('ru-RU')+' ₽</td><td><span class="pill '+pi+'">'+c.irrigation+'</span><div style="font-size:10.5px;color:#8a9a82">'+c.cost_irr_rub.toLocaleString('ru-RU')+' ₽/га</div></td><td class="num">'+(c.heat_p!=null?Math.round(c.heat_p*100)+'%':'—')+'</td><td class="num">'+c.loss_heat_rub.toLocaleString('ru-RU')+' ₽</td><td><span class="pill '+pa+'">'+c.antistress+'</span><div style="font-size:10.5px;color:#8a9a82">'+c.cost_anti_rub.toLocaleString('ru-RU')+' ₽/га</div></td></tr>';
   });
   h+='</table><div class="foot">Ожидаемый убыток = вероятность × доля потерь × типовая урожайность × цена. '+ec.source+'</div></div>';
  }
  try{
   const fields=JSON.parse(localStorage.getItem('agrocast_fields')||'[]');
   if(fields.length){
    const irr=((ins.water||{}).irrigation_m3_ha||{});
    const ecc=(agro.econ||{}).crops||[];
    h+='<div class="block agro"><h2>Мои поля</h2><table><tr><th>Поле</th><th>Культура</th><th>Площадь</th><th>Полив, медиана</th><th>Полив, сухой сценарий</th><th>Вердикт по культуре</th><th>Риск, ₽ на поле</th></tr>';
    fields.forEach(f=>{
     const c=(ph.crops||[]).find(x=>x.key===f.crop);
     const e=ecc.find(x=>x.key===f.crop);
     h+='<tr><td><b>'+f.name+'</b></td><td>'+(c?c.name:f.crop)+'</td><td class="num">'+f.area+' га</td><td class="num">'+Math.round((irr.p50||0)*f.area).toLocaleString('ru-RU')+' м³</td><td class="num">'+Math.round((irr.p10||0)*f.area).toLocaleString('ru-RU')+' м³</td><td style="font-size:11.5px">'+(c?c.verdict:'—')+'</td><td class="num">'+(e?Math.round(e.risk_rub_ha*f.area).toLocaleString('ru-RU')+' ₽':'—')+'</td></tr>';
    });
    h+='</table><div class="foot">Объём = оросительная норма отчёта × площадь поля; риск в деньгах — ожидаемый убыток без защиты × площадь. Список полей хранится в этом браузере; управление — на главной странице.</div></div>';
   }
  }catch(e){}
  if(ins.risks&&ins.risks.length){
   h+='<div class="block"><h2>Реестр рисков (вероятность → последствие → действие)</h2><table><tr><th>Риск</th><th>Окно</th><th>Вероятность</th><th>Чем грозит</th><th>Что делать</th></tr>';
   ins.risks.forEach(r=>{
    const cls=r.prob>=0.5?'bad':(r.prob>=0.25?'warn':'ok');
    h+='<tr><td><b>'+r.label+'</b></td><td style="font-size:11.5px">'+r.window+'</td><td><span class="pill '+cls+'">'+Math.round(r.prob*100)+'%</span></td><td style="font-size:11.5px">'+r.impact+'</td><td style="font-size:11.5px">'+r.action+'</td></tr>';
   });
   h+='</table></div>';
  }
  if(si&&si.htk){
   h+='<div class="block"><h2>Агроиндексы периода</h2><div class="dash">'+
   chip3('ГТК Селянинова',si.htk.p50==null?'—':si.htk.p50.toFixed(2),'P10 '+(si.htk.p10==null?'—':si.htk.p10.toFixed(2))+' · P90 '+(si.htk.p90==null?'—':si.htk.p90.toFixed(2)))+
   chip3('Сумма осадков, мм',si.total_precip?Math.round(si.total_precip.p50):'—','P10 '+Math.round(si.total_precip.p10)+' · P90 '+Math.round(si.total_precip.p90))+
   chip3('Макс. бездождный, дней',si.dry_spell_max?Math.round(si.dry_spell_max.p50):'—','P90 '+Math.round(si.dry_spell_max.p90))+
   chip3('Дней >35°C',si.hot_days_35?Math.round(si.hot_days_35.p50):'—')+'</div>'+
   '<div class="foot">ГТК &lt;0.7 засушливо · 0.7–1.0 мало влаги · &gt;1.0 достаточно · &gt;1.6 переувлажнение</div></div>'}
  items.forEach(it=>{
   const ttl=f.mode==='seasonal'?(it.months?it.months.join(' – '):''):(MN[it.month]+' '+it.year);
   h+='<div class="block"><h2>'+(f.mode==='seasonal'?'Сезон: ':'Месяц: ')+ttl+' <span style="font-size:12px;color:#8a9a82">· горизонт '+it.lead+' мес</span></h2>';
   if(it.t2m)h+=fcBlock(it.t2m,'Температура','°C');
   if(it.tp)h+=fcBlock(it.tp,'Осадки','мм');
   h+='</div>'+advice(it.advice)});
  const af=agro.analogs_facts;
  if(af&&af.length){
   h+='<div class="block"><h2>Года-аналоги: каким был этот сезон на деле</h2><table><tr><th>Год</th><th>Вес аналога</th><th>T фактом к норме</th><th>Осадки от нормы</th></tr>';
   af.forEach(a=>{
    h+='<tr><td class="num">'+a.year+((a.note||a.yield_note)?'<div style="font-size:10.5px;color:#8a6a2a">'+(a.note||'')+(a.note&&a.yield_note?'<br>':'')+(a.yield_note||'')+'</div>':'')+'</td><td>'+Math.round(a.weight*100)+'%</td><td class="num">'+(a.t_anom>0?'+':'')+a.t_anom+'°C</td><td class="num">'+(a.tp_pct_of_norm==null?'—':a.tp_pct_of_norm+'%')+'</td></tr>';
   });
   h+='</table><div class="foot">Фактическая погода тех лет в тот же сезон — прямая проверка, во что вырождаются аналоги. Справка по сбору зерна в РФ — Росстат (округлённо).</div></div>';
  }
  h+='<div class="foot">Движок AgroCast: собственные расчёты на открытых данных (NOAA NCEP/CPC/ERSST/OISST, NOAA CDR snow) — SST-лаги, LIM-прогноз океана, режимы NAO/EA, стратосфера (полярный вихрь), ансамбль из 9 моделей с сезонными воротами, изотоническая и конформная калибровка, нейроядро, публичный реестр доверия. Прогноз вероятностный — решения принимайте с учётом рисков.<br>Отчёт сгенерирован '+new Date().toLocaleString('ru-RU')+'.</div>';
 }
  h+='<div class="printfoot">AgroCast — сезонный агропрогноз · точка '+(f.lat!=null?f.lat.toFixed(2):'?')+'°N '+(f.lon!=null?f.lon.toFixed(2):'?')+'°E · период '+f.start+' · отпечатано '+new Date().toLocaleString('ru-RU')+' · вероятностный прогноз, не гарантия</div>';
  h+='<button class="btn" onclick="window.print()">Скачать / печать в PDF</button> <button class="btn g" onclick="location=\'/\'">← Новый расчёт</button>';
 document.getElementById('app').innerHTML=h;
 document.title='AgroCast · '+(f.kind==='hindcast'?'проверка '+f.start:f.lat.toFixed(2)+'N '+f.lon.toFixed(2)+'E');
}).catch(e=>{document.getElementById('app').innerHTML='<div class="block">Ошибка загрузки: '+e+'<br><a href="/" style="color:#3c6a2f">← к карте</a></div>'});
function hindVar(v,name){
 if(!v)return '';
 const u=v.unit==='c'?'°C':' мм';
 const fmt=x=>v.unit==='c'?x.toFixed(1):Math.round(x);
 let h='<div style="margin-top:12px"><b style="font-size:13.5px;color:#2c4a24">'+name+'</b> ';
 h+=v.hit?'<span class="tag">попали</span>':'<span class="tag bad">промах</span>';
 h+='<div style="font-size:12px;color:#6a7a62;margin:6px 0 4px">прогноз:</div>'+bar({below:v.probs[0],normal:v.probs[1],above:v.probs[2]});
 h+='<div style="font-size:12px;color:#6a7a62;margin:6px 0 4px">факт:</div>'+factbar(v.obs);
 h+=kv('Система ждала',WORD[v.dominant]+' ('+Math.round(v.probs[v.dominant]*100)+'%)')+
    kv('Фактически',WORD[v.obs])+
    kv('Прогноз P50 / факт / норма',fmt(v.p50)+' / '+fmt(v.fact)+' / '+fmt(v.norm)+' '+u)+'</div>';
 return h}
</script>
